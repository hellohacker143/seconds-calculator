<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirana Bill</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#111}.actions{max-width:850px;margin:16px auto;display:flex;justify-content:flex-end;gap:8px;padding:0 12px}button{border:0;border-radius:8px;padding:12px 16px;background:#0788c9;color:white;font-weight:bold}.bill{max-width:850px;margin:0 auto 24px;background:white;padding:24px}h1{text-align:center}table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid #ddd;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}.total{text-align:right;font-size:22px;font-weight:bold;margin-top:20px}.thanks{text-align:center;margin-top:28px;font-weight:bold}@media(max-width:500px){.bill{padding:12px}th,td{font-size:12px;padding:8px 3px}}@media print{body{background:white}.actions{display:none}.bill{margin:0;box-shadow:none;padding:8mm}@page{margin:8mm}}</style></head><body><div class="actions"><button onclick="copyUrl()">Copy Bill URL</button><button onclick="window.print()">Print Bill</button></div><main id="bill" class="bill">Loading bill…</main><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function load(){try{let p=new URLSearchParams(location.hash.slice(1)),d=JSON.parse(decodeURIComponent(escape(atob(p.get('data')))));if(!d.items?.length)throw Error('No products in this bill');let total=0;let rows=d.items.map((x,i)=>{let a=Number(x.rate)*Number(x.qty);total+=a;return '<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.qty)+'</td><td>'+money(x.rate)+'</td><td>'+money(a)+'</td></tr>'}).join('');document.getElementById('bill').innerHTML='<h1>'+esc(d.store||'KIRANA GENERAL STORE')+'</h1><p style="text-align:center">BILL COPY</p><table><thead><tr><th>No.</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total">GRAND TOTAL: '+money(total)+'</div><p class="thanks">THANK YOU!<br>VISIT AGAIN</p>'}catch(e){document.getElementById('bill').textContent='Bill data not found. Go back and press Print Bill again.'}}function copyUrl(){if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('Bill URL copied')).catch(()=>prompt('Copy bill URL',location.href));else prompt('Copy bill URL',location.href)}load();</script></body></html>
