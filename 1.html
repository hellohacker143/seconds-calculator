<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Bill — Custom Shop Name</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#111;font-family:Arial,Helvetica,sans-serif}input{font:inherit;min-width:0;padding:12px;border:1px solid #bbb;border-radius:7px}button{font:inherit;font-weight:700;border:0;border-radius:7px;padding:12px 14px;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#e7e7e7;color:#111}.bill{max-width:900px;margin:0 auto 24px;background:#fff;padding:22px 12px 28px}h1{text-align:center;font-size:clamp(28px,5vw,48px);margin:8px 0 30px;text-transform:uppercase;overflow-wrap:anywhere}.date{font-size:clamp(17px,3vw,27px);font-weight:700;line-height:1.35}.dash{border:0;border-top:5px dashed #111;margin:24px 0}.table-head,.item-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(48px,.7fr) minmax(45px,.6fr) minmax(75px,1fr) 22px;gap:5px;align-items:center}.table-head{font-weight:700;text-align:center;padding:12px 0;font-size:clamp(12px,2vw,19px)}.item-row{padding:25px 0;border-bottom:5px dashed #111;min-height:100px}.item-row input{border:0;border-radius:0;outline:none;box-shadow:none;padding:5px 0;background:transparent;width:100%;text-align:center;font-weight:700}.item-row input:focus{outline:none;box-shadow:none;background:transparent}.item-row .name{text-align:left;font-size:clamp(15px,2.8vw,24px)}.item-row .rate,.item-row .qty{font-size:clamp(22px,4.5vw,38px)}.item-row input::-webkit-inner-spin-button,.item-row input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.item-row input[type=number]{appearance:textfield;-moz-appearance:textfield}.amount{font-size:clamp(17px,3.3vw,29px);font-weight:700;text-align:right;overflow-wrap:anywhere}.remove{color:#c00;background:transparent;padding:0;font-size:24px}.actions{display:none!important}.summary{display:flex;justify-content:space-between;gap:12px;font-size:clamp(16px,2.8vw,24px);margin:24px 0 34px}.total{border-top:6px dashed #111;padding-top:24px;display:flex;justify-content:space-between;gap:12px;font-size:clamp(32px,7vw,58px);font-weight:700}.thanks{display:block;margin-top:24px;background:#e8e8e8;padding:14px 20px;font-size:clamp(17px,3vw,26px);font-weight:700;text-align:center;cursor:pointer;border:0;width:100%}@media(max-width:420px){.bill{padding-left:8px;padding-right:8px}.item-row{gap:3px}.table-head,.item-row{grid-template-columns:minmax(0,1.7fr) minmax(38px,.6fr) minmax(35px,.5fr) minmax(65px,.9fr) 18px}}@media print{body{background:#fff}.actions,.remove{display:none!important}.bill{margin:0;max-width:none;padding:0}.item-row input{border:0}.dash,.item-row{border-color:#000}.thanks{background:#fff}}
</style></head>
<body>
<main class="bill"><h1 id="shopTitle" style="display:none"></h1><div class="date">DATE: <span id="date"></span><br>TIME: <span id="time"></span></div><hr class="dash"><div class="table-head"><span>ITEM</span><span>RATE</span><span>QTY</span><span>AMOUNT</span><span></span></div><hr class="dash"><div id="items"></div><div class="actions"><button class="primary" id="addBtn">+ Add Item</button><button class="secondary" id="printBtn">Print Bill</button><button class="secondary" id="clearBtn">Clear Items</button></div><hr class="dash"><div class="summary"><div>TOTAL ITEM(S): <span id="itemCount">0</span><br>/QTY: <span id="qtyTotal">0</span></div><strong id="smallTotal">0.00</strong></div><div class="total"><span>TOTAL:</span><span id="grandTotal">0.00</span></div><button type="button" class="thanks" id="newBillBtn">THANK YOU FOR VISITING</button></main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const shopName=(params.get('shop')||'').trim();
function applyShopName(){$('shopTitle').textContent=shopName.toUpperCase();$('shopTitle').style.display=shopName?'block':'none';document.title=(shopName?shopName+' — ':'')+'Quick Bill'}
function updateDate(){const now=new Date();$('date').textContent=now.toLocaleDateString('en-GB');$('time').textContent=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function addItem(name='',rate='',qty=''){const row=document.createElement('div');row.className='item-row';row.innerHTML='<input class="name" aria-label="Item name" placeholder="Item name"><input class="rate" aria-label="Rate" type="number" min="0" step="any" placeholder="0"><input class="qty" aria-label="Quantity" type="number" min="0" step="any" placeholder="0"><div class="amount">0.00</div><button class="remove" aria-label="Remove item">×</button>';row.querySelector('.name').value=name;row.querySelector('.rate').value=rate;row.querySelector('.qty').value=qty;row.querySelectorAll('input').forEach(el=>{el.addEventListener('input',calculate);el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const fields=[...row.querySelectorAll('input')];const idx=fields.indexOf(el);if(idx<fields.length-1){fields[idx+1].focus();fields[idx+1].select?.()}else{const next=addItem();next.querySelector('.name').focus()}})});row.querySelector('.remove').addEventListener('click',()=>{row.remove();calculate()});$('items').appendChild(row);calculate();return row}
function calculate(){let total=0,qtyTotal=0,count=0;document.querySelectorAll('.item-row').forEach(row=>{const name=row.querySelector('.name').value.trim(),rate=Number(row.querySelector('.rate').value)||0,qty=Number(row.querySelector('.qty').value)||0,amount=rate*qty;row.querySelector('.amount').textContent=amount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});if(name||row.querySelector('.rate').value||row.querySelector('.qty').value)count++;total+=amount;qtyTotal+=qty});const formatted=total.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});$('itemCount').textContent=count;$('qtyTotal').textContent=qtyTotal;$('smallTotal').textContent=formatted;$('grandTotal').textContent=formatted}
$('newBillBtn').addEventListener('click',()=>{if(!confirm('Start a new bill? This will clear the current items.'))return;$('items').innerHTML='';calculate();const row=addItem();row.querySelector('.name').focus();window.scrollTo({top:0,behavior:'smooth'})});
applyShopName();updateDate();setInterval(updateDate,30000);addItem();
</script></body></html>
