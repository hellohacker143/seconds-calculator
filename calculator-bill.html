<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Bill</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.start{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px}.start h1{font-size:clamp(30px,8vw,48px);margin:0;font-weight:900}.customer{width:min(100%,520px);font-size:24px;font-weight:700;padding:18px 14px;border:2px solid #222;border-radius:10px}.btn{border:0;border-radius:10px;background:#111;color:#fff;font-size:28px;font-weight:900;padding:20px 34px;cursor:pointer}.bill{display:none;padding:10px;max-width:1000px;margin:auto}.billtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.billtop h1{text-align:center;font-size:clamp(25px,5vw,46px);margin:8px 0;font-weight:1000}.customer-label{font-size:clamp(18px,3vw,26px);font-weight:900;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools button{font-size:17px;padding:12px 16px}.secondary{background:#e7e7e7;color:#111}.dash{border:0;border-top:3px dashed #111;margin:10px 0}.meta{display:flex;justify-content:space-between;gap:8px;font-size:clamp(15px,2.5vw,22px);font-weight:900}.grid{display:grid;grid-template-columns:45px minmax(75px,1fr) minmax(85px,1fr) minmax(70px,.8fr) minmax(100px,1.2fr) 35px;gap:6px;align-items:center}.head{font-size:clamp(14px,2.6vw,24px);font-weight:1000;text-align:center;padding:9px 0}.row{padding:9px 0}.row input{width:100%;min-width:0;padding:10px 5px;font-size:clamp(18px,3vw,28px);font-weight:900;border:1px solid #bbb;border-radius:6px}.num{font-size:clamp(22px,3.5vw,32px);font-weight:1000;text-align:center}.amount{text-align:right;white-space:nowrap;font-size:clamp(22px,3.5vw,34px);font-weight:1000}.remove{background:#ffe1e1;color:#900;border:0;border-radius:6px;font-size:22px;padding:8px 4px}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(19px,3vw,28px);font-weight:1000;padding:12px 0}.total{border-top:4px dashed #111;margin-top:8px;padding-top:12px;display:flex;justify-content:space-between;gap:8px;font-size:clamp(38px,8vw,76px);font-weight:1000}.total span:last-child{white-space:nowrap}.printname,.printrate,.printqty{display:none}
@media(max-width:480px){.bill{padding:7px 4px}.grid{grid-template-columns:25px minmax(50px,1fr) minmax(58px,1fr) minmax(43px,.7fr) minmax(72px,1.1fr) 24px;gap:3px}.head{font-size:11px}.row input{font-size:16px;padding:10px 2px}.num,.amount{font-size:17px}.remove{font-size:16px;padding:6px 2px}.summary{font-size:15px}.total{font-size:clamp(30px,8vw,46px)}}
@media print{
 @page{size:58mm auto;margin:2mm}
 body{background:#fff}.start,.tools,.remove,.no-print{display:none!important}.bill{display:block!important;max-width:none;width:100%;padding:0;margin:0}.billtop h1{font-size:24px;width:100%;margin:0 0 7px}.billtop{display:block}.customer-label{font-size:17px;margin:4px 0}.meta{font-size:13px}.dash{border-top-width:2px;margin:6px 0}.grid{grid-template-columns:18px minmax(0,1fr) minmax(0,.95fr) minmax(0,.7fr) minmax(0,1fr);gap:2px}.head{font-size:11px;padding:5px 0}.row{padding:6px 0}.row input{display:none}.printname,.printrate,.printqty{display:block;font-size:clamp(13px,4vw,18px);font-weight:1000;overflow-wrap:anywhere}.num,.amount{font-size:clamp(13px,4vw,18px);font-weight:1000}.summary{font-size:13px;padding:7px 0}.total{font-size:clamp(27px,8vw,40px);border-top-width:2px;padding-top:8px;margin-top:4px}
}
</style></head>
<body>
<section class="start" id="start"><h1>NEW BILL</h1><input class="customer" id="customerInput" placeholder="Customer name (optional)" aria-label="Customer name"><button class="btn" id="newBill">＋ New Bill</button></section>
<main class="bill" id="bill">
 <div class="billtop"><h1>CALCULATOR BILL</h1></div>
 <div class="customer-label" id="customerLabel" style="display:none"></div>
 <div class="meta"><span>BILL NO: <b id="billno">56905</b></span><span>DATE: <b id="date"></b><br>TIME: <b id="time"></b></span></div>
 <hr class="dash"><div class="grid head"><div>S.No.</div><div>ITEM</div><div>RATE</div><div>QTY</div><div>AMOUNT</div><div></div></div><hr class="dash">
 <div id="items"></div><hr class="dash">
 <div class="summary"><span>TOTAL ITEM(S): <b id="count">0</b><br>QTY: <b id="qtytotal">0</b></span><span id="subtotal">₹0.00</span></div>
 <div class="total"><span>TOTAL:</span><span id="grand">₹0.00</span></div>
 <div class="tools no-print"><button class="btn" id="add">＋ Add Item</button><button class="btn" onclick="window.print()">Print Bill</button><button class="btn secondary" id="new">New Bill</button></div>
</main>
<script>
const box=document.querySelector('#items');let serial=56905;
const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function clock(){const d=new Date();document.querySelector('#date').textContent=d.toLocaleDateString('en-GB');document.querySelector('#time').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(name='',rate='',qty='1'){const r=document.createElement('div');r.className='grid row';r.innerHTML='<div class="num"></div><div><input class="name" placeholder="Item" aria-label="Item name" value="'+safe(name)+'"><span class="printname"></span></div><div><input class="rate" type="number" min="0" step=".01" inputmode="decimal" placeholder="Rate" value="'+rate+'" aria-label="Rate"><span class="printrate"></span></div><div><input class="qty" type="number" min="0" step="any" inputmode="decimal" value="'+qty+'" aria-label="Quantity"><span class="printqty"></span></div><div class="amount">₹0.00</div><button class="remove" aria-label="Remove item">×</button>';box.appendChild(r);r.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));r.querySelector('.remove').onclick=()=>{r.remove();calc()};calc();r.querySelector('.rate').focus()}
function calc(){let total=0,qty=0,count=0;[...box.children].forEach((r,i)=>{r.querySelector('.num').textContent=i+1;const name=r.querySelector('.name').value.trim(),rate=Math.max(0,+r.querySelector('.rate').value||0),q=Math.max(0,+r.querySelector('.qty').value||0),amount=rate*q;r.querySelector('.amount').textContent='₹'+fmt(amount);r.querySelector('.printname').textContent=name||'Item '+(i+1);r.querySelector('.printrate').textContent=fmt(rate);r.querySelector('.printqty').textContent=q;if(r.querySelector('.rate').value!==''||name)count++;total+=amount;qty+=q});document.querySelector('#count').textContent=count;document.querySelector('#qtytotal').textContent=+qty.toFixed(3);document.querySelector('#subtotal').textContent='₹'+fmt(total);document.querySelector('#grand').textContent='₹'+fmt(total)}
function startBill(){document.querySelector('#start').style.display='none';document.querySelector('#bill').style.display='block';document.querySelector('#customerLabel').textContent=document.querySelector('#customerInput').value.trim();document.querySelector('#customerLabel').style.display=document.querySelector('#customerLabel').textContent?'block':'none';clock();if(!box.children.length)add()}
document.querySelector('#newBill').onclick=()=>{startBill()};
document.querySelector('#add').onclick=()=>add();
document.querySelector('#new').onclick=()=>{serial++;document.querySelector('#billno').textContent=serial;box.innerHTML='';document.querySelector('#start').style.display='flex';document.querySelector('#bill').style.display='none';document.querySelector('#customerInput').value=''};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.rate')){e.preventDefault();const q=e.target.closest('.row').querySelector('.qty');q.focus();q.select()}else if(e.key==='Enter'&&e.target.matches('.qty')){e.preventDefault();add()}});
clock();
</script></body></html>
