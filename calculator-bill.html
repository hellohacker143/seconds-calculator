<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator Bill</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#111;font-family:Arial,sans-serif}.app{max-width:950px;margin:auto;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:8px;padding:12px 15px;font-size:16px;font-weight:bold;cursor:pointer}.dark{background:#111;color:white}.light{background:#e1e5ea;color:#111}.paper{background:white;padding:clamp(12px,3vw,26px);box-shadow:0 4px 20px #0001}.title{text-align:center;font-size:clamp(28px,6vw,48px);font-weight:1000;margin:0 0 14px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:clamp(13px,2.5vw,19px);font-weight:bold;flex-wrap:wrap}.dash{border:0;border-top:3px dashed #222;margin:12px 0}.grid{display:grid;grid-template-columns:34px minmax(60px,1.1fr) minmax(65px,.9fr) minmax(55px,.7fr) minmax(75px,1fr) 28px;gap:5px;align-items:center}.head{font-size:clamp(12px,2.6vw,23px);font-weight:900;text-align:center;padding:8px 0}.row{padding:6px 0}.row input{width:100%;min-width:0;padding:10px 4px;border:1px solid #cbd0d6;border-radius:6px;font-size:clamp(16px,3vw,25px);font-weight:800}.num{text-align:center;font-size:clamp(18px,3vw,28px);font-weight:900}.amount{text-align:right;white-space:nowrap;font-size:clamp(16px,3vw,26px);font-weight:900}.remove{padding:6px 3px;background:#ffe0e0;color:#900}.summary{display:flex;justify-content:space-between;gap:8px;font-size:clamp(16px,3vw,26px);font-weight:900;padding:12px 0}.total{border-top:4px dashed #111;padding-top:12px;display:flex;justify-content:space-between;gap:8px;font-size:clamp(30px,7vw,62px);font-weight:1000}.total span:last-child{white-space:nowrap}.printname,.printrate,.printqty{display:none}
@media(max-width:420px){.app{padding:5px}.paper{padding:8px 5px}.grid{grid-template-columns:22px minmax(45px,1fr) minmax(53px,.9fr) minmax(43px,.7fr) minmax(63px,1fr) 22px;gap:3px}.head{font-size:10px}.row input{font-size:15px;padding:9px 2px}.num,.amount{font-size:15px}.remove{font-size:14px;padding:5px 1px}.summary{font-size:14px}.total{font-size:clamp(27px,8vw,38px)}}
@media print{@page{size:58mm auto;margin:3mm}body{background:white}.app{padding:0;max-width:none}.toolbar,.hint,.remove{display:none!important}.paper{padding:0;box-shadow:none}.title{font-size:20px;margin-bottom:8px}.meta{font-size:10px}.dash{border-top-width:1px;margin:5px 0}.grid{grid-template-columns:14px minmax(0,1.2fr) minmax(0,.9fr) minmax(0,.65fr) minmax(0,1fr);gap:2px}.head{font-size:9px}.row{padding:3px 0}.row input{display:none}.printname,.printrate,.printqty{display:block;font-size:10px;overflow-wrap:anywhere}.num,.amount{font-size:10px}.summary{font-size:10px;padding:5px 0}.total{font-size:25px;border-top-width:1px;padding-top:7px}}
</style></head><body><div class="app"><div class="toolbar"><button class="dark" id="add">＋ Add Item</button><button class="dark" onclick="window.print()">Print Bill</button><button class="light" id="new">New Bill</button><button class="light" id="clear">Clear Items</button></div><main class="paper"><h1 class="title">CALCULATOR BILL</h1><div class="meta"><span>BILL NO: <b id="billno">56905</b></span><span>DATE: <b id="date"></b><br>TIME: <b id="time"></b></span></div><hr class="dash"><div class="grid head"><div>S.No.</div><div>ITEM</div><div>RATE</div><div>QTY</div><div>AMOUNT</div><div></div></div><hr class="dash"><div id="items"></div><hr class="dash"><div class="summary"><span>TOTAL ITEMS: <b id="count">0</b><br>TOTAL QTY: <b id="qtytotal">0</b></span><span id="subtotal">₹0.00</span></div><div class="total"><span>TOTAL:</span><span id="grand">₹0.00</span></div><p class="hint">Enter rate and quantity. Amount and total calculate automatically. Press Enter in rate to go to quantity; Enter in quantity adds a new row.</p></main></div>
<script>
const box=document.querySelector('#items');let serial=56905;
const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function clock(){let d=new Date();document.querySelector('#date').textContent=d.toLocaleDateString('en-GB');document.querySelector('#time').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(name='',rate='',qty='1'){let r=document.createElement('div');r.className='grid row';r.innerHTML='<div class="num"></div><div><input class="name" placeholder="Item name" aria-label="Item name" value="'+safe(name)+'"><span class="printname"></span></div><div><input class="rate" type="number" min="0" step=".01" inputmode="decimal" placeholder="0.00" value="'+rate+'" aria-label="Rate"><span class="printrate"></span></div><div><input class="qty" type="number" min="0" step="any" inputmode="decimal" value="'+qty+'" aria-label="Quantity"><span class="printqty"></span></div><div class="amount">₹0.00</div><button class="remove" title="Remove">×</button>';box.appendChild(r);r.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));r.querySelector('.remove').onclick=()=>{r.remove();calc()};renumber();calc();r.querySelector('.rate').focus()}
function renumber(){[...box.children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}
function calc(){let total=0,qty=0,count=0;[...box.children].forEach(r=>{let name=r.querySelector('.name').value.trim(),rate=Math.max(0,+r.querySelector('.rate').value||0),q=Math.max(0,+r.querySelector('.qty').value||0),amount=rate*q;r.querySelector('.amount').textContent='₹'+fmt(amount);r.querySelector('.printname').textContent=name||'Item '+r.querySelector('.num').textContent;r.querySelector('.printrate').textContent=fmt(rate);r.querySelector('.printqty').textContent=q;if(r.querySelector('.rate').value!==''||name)count++;total+=amount;qty+=q});document.querySelector('#count').textContent=count;document.querySelector('#qtytotal').textContent=+qty.toFixed(3);document.querySelector('#subtotal').textContent='₹'+fmt(total);document.querySelector('#grand').textContent='₹'+fmt(total);renumber()}
document.querySelector('#add').onclick=()=>add();document.querySelector('#clear').onclick=()=>{box.innerHTML='';add()};document.querySelector('#new').onclick=()=>{serial++;document.querySelector('#billno').textContent=serial;box.innerHTML='';clock();add()};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.rate')){e.preventDefault();let q=e.target.closest('.row').querySelector('.qty');q.focus();q.select()}else if(e.key==='Enter'&&e.target.matches('.qty')){e.preventDefault();add()}});clock();add();
</script></body></html>
