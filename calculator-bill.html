<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Bill</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}.start{display:none}.start h1{font-size:clamp(32px,8vw,50px);margin:0;font-weight:900}.customer{display:none}.btn{border:0;border-radius:10px;background:#111;color:#fff;font-size:25px;font-weight:900;padding:18px 28px;cursor:pointer}.bill{display:none;padding:10px;max-width:1000px;margin:auto}.billtop h1{text-align:center;font-size:clamp(30px,6vw,52px);margin:8px 0 16px;font-weight:1000}.customer-label{display:none!important}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools button{font-size:18px;padding:13px 18px}.tools #add,.tools button[onclick]{display:none!important}.tools #new{display:inline-block!important}.secondary{background:#e7e7e7;color:#111}.dash{border:0;border-top:3px dashed #000;margin:12px 0}.meta{display:flex;justify-content:space-between;gap:8px;font-size:clamp(17px,3vw,25px);font-weight:1000}.grid{display:grid;grid-template-columns:34px minmax(35px,.8fr) minmax(45px,1fr) minmax(38px,.8fr) minmax(70px,1.2fr);gap:3px;align-items:center}.head{font-size:clamp(16px,3vw,27px);font-weight:1000;text-align:center;padding:12px 0}.row{padding:16px 0;min-height:84px;border-bottom:4px dashed #000}.row input,.row input:focus,.row input:focus-visible,.row input:active{display:block;width:100%;min-width:0;padding:8px 0;font-size:clamp(34px,8vw,54px);font-weight:1000;text-align:center;border:none!important;border-width:0!important;border-radius:0!important;outline:none!important;box-shadow:none!important;background:transparent!important;color:#000;appearance:none!important;-webkit-appearance:none!important;-webkit-tap-highlight-color:transparent}.blank-item{min-height:44px;width:100%}.num{font-size:clamp(30px,7vw,46px);font-weight:1000;text-align:center}.amount{text-align:right;white-space:nowrap;font-size:clamp(28px,6.5vw,46px);font-weight:1000}.remove{display:none!important}.summary{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(20px,3.6vw,30px);font-weight:1000;padding:13px 0}.total{border-top:4px dashed #000;margin-top:8px;padding-top:14px;display:flex;justify-content:space-between;gap:8px;font-size:clamp(42px,9vw,82px);font-weight:1000}.total span:last-child{white-space:nowrap}
@media(max-width:480px){.bill{padding:6px 3px}.grid{grid-template-columns:27px minmax(24px,.7fr) minmax(42px,1fr) minmax(34px,.8fr) minmax(65px,1.2fr);gap:2px}.head{font-size:clamp(11px,3.2vw,15px);padding:10px 0}.row{min-height:78px;padding:15px 0;border-bottom:3px dashed #000}.row input,.row input:focus,.row input:focus-visible,.row input:active{font-size:clamp(30px,7.5vw,42px);padding:8px 0;border:none!important;border-width:0!important;border-radius:0!important;outline:none!important;box-shadow:none!important;background:transparent!important;appearance:none!important;-webkit-appearance:none!important}.blank-item{min-height:42px}.num{font-size:clamp(27px,7vw,36px)}.amount{font-size:clamp(24px,6.2vw,34px)}.summary{font-size:clamp(16px,4vw,21px)}.total{font-size:clamp(34px,9vw,48px)}}
@media print{
 @page{size:58mm auto;margin:2mm}
 html,body{width:54mm;margin:0!important;padding:0!important;background:#fff}.start,.remove{display:none!important}.bill{display:block!important;width:54mm;max-width:none;padding:0;margin:0}.billtop h1{font-size:25px;line-height:1.05;margin:0 0 8px;font-weight:1000}.customer-label{font-size:16px;margin:3px 0}.meta{font-size:12px;line-height:1.35}.dash{border-top:2px dashed #000;margin:6px 0}.grid{grid-template-columns:12px minmax(0,.7fr) minmax(0,.9fr) minmax(0,.65fr) minmax(0,1.1fr);gap:1px}.head{font-size:11px;padding:7px 0;font-weight:1000}.row{padding:10px 0;min-height:44px;border-bottom:2px dashed #000}.row input,.row input:focus,.row input:focus-visible,.row input:active{display:block;border:none!important;border-width:0!important;border-radius:0!important;padding:0;background:transparent!important;font-size:27px;line-height:1.1;font-weight:1000;text-align:center;outline:none!important;box-shadow:none!important;appearance:none!important;-webkit-appearance:none!important}.row input::-webkit-inner-spin-button,.row input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.row input.rate,.row input.qty{font-size:27px}.blank-item{min-height:26px}.num{font-size:20px}.amount{font-size:25px;line-height:1.1;font-weight:1000}.summary{font-size:13px;line-height:1.3;padding:7px 0;font-weight:1000}.total{font-size:34px;line-height:1.05;border-top:2px dashed #000;padding-top:8px;margin-top:4px;font-weight:1000}.total span:last-child{font-size:34px}
}
</style></head><body>

<main class="bill" id="bill"><div class="billtop"><h1>SHIVA KIRANA</h1></div>
<div class="meta"><span>BILL NO: <b id="billno">56905</b></span><span>DATE: <b id="date"></b><br>TIME: <b id="time"></b></span></div>
<hr class="dash"><div class="grid head"><div>S.No.</div><div>ITEM</div><div>RATE</div><div>QTY</div><div>AMOUNT</div></div><hr class="dash"><div id="items"></div><hr class="dash">
<div class="summary"><span>TOTAL ITEM(S): <b id="count">0</b><br>/QTY: <b id="qtytotal">0</b></span><span id="subtotal">0.00</span></div><div class="total"><span>TOTAL:</span><span id="grand">0.00</span></div>
<div class="tools no-print"><button class="btn" id="add">＋ Add Item</button><button class="btn" onclick="window.print()">Print Bill</button><div class="btn secondary" style="text-align:center">THANK YOU FOR SHOPPING</div></div></main>
<script>
const box=document.querySelector('#items');let serial=56905;const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function clock(){const d=new Date();document.querySelector('#date').textContent=d.toLocaleDateString('en-GB');document.querySelector('#time').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false})}
function add(rate='',qty='1'){const r=document.createElement('div');r.className='grid row';r.innerHTML='<div class="num"></div><div class="blank-item" aria-label="Blank space to write item name"></div><div><input class="rate" type="number" min="0" step=".01" inputmode="decimal" placeholder="Rate" value="'+rate+'" aria-label="Rate"></div><div><input class="qty" type="number" min="0" step="any" value="'+qty+'" aria-label="Quantity"></div><div class="amount">0.00</div>';box.appendChild(r);r.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();r.querySelector('.rate').focus()}
function calc(){let total=0,qty=0,count=0;[...box.children].forEach((r,i)=>{r.querySelector('.num').textContent=i+1;const rate=Math.max(0,+r.querySelector('.rate').value||0),q=Math.max(0,+r.querySelector('.qty').value||0),amount=rate*q;r.querySelector('.amount').textContent=fmt(amount);if(r.querySelector('.rate').value!=='')count++;total+=amount;qty+=q});document.querySelector('#count').textContent=count;document.querySelector('#qtytotal').textContent=+qty.toFixed(3);document.querySelector('#subtotal').textContent=fmt(total);document.querySelector('#grand').textContent=fmt(total)}
document.querySelector('#add').onclick=()=>add();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.rate')){e.preventDefault();const q=e.target.closest('.row').querySelector('.qty');q.focus();q.select()}else if(e.key==='Enter'&&e.target.matches('.qty')){e.preventDefault();add()}});
document.querySelector('#bill').style.display='block';add();clock();
</script></body></html>
